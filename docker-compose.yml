services:
  app:
    container_name: vue-jenkins-pipeline-dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
      - "8080:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run dev -- --host
    stdin_open: true
    tty: true
